<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kampüs Memnuniyet ve Talep Haritası</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDB5gBNWtzrZAk4do8HdC0sR3_rB37Iqhs",
            authDomain: "kampus-gorus-haritasi77.firebaseapp.com",
            projectId: "kampus-gorus-haritasi77",
            storageBucket: "kampus-gorus-haritasi77.firebasestorage.app",
            messagingSenderId: "761474558310",
            appId: "1:761474558310:web:8d51681b37c8d1cd27c0a7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // HARİTA PİKSEL ÖLÇÜLERİ (2500x1768)
        const imgWidth = 2500;  
        const imgHeight = 1768; 

        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -2,
            maxZoom: 2
        });

        const bounds = [[0, 0], [imgHeight, imgWidth]];
        L.imageOverlay('harita.jpg', bounds).addTo(map);
        map.fitBounds(bounds);

        let tempMarker = null;
        let selectedCoords = null;
        let adminMarkers = [];
        let allPinsData = [];

        // Öğrenci Haritaya Tıkladığında
        map.on('click', function(e) {
            if (auth.currentUser) return;
            selectedCoords = e.latlng;
            
            if (tempMarker) map.removeLayer(tempMarker);
            
            const targetIcon = L.divIcon({
                className: 'target-pin',
                html: `<div style="position:relative; width:24px; height:24px;">
                        <div style="position:absolute; top:0; left:0; width:24px; height:24px; background:rgba(52, 152, 219, 0.35); border-radius:50%; animation: pulse 1.5s infinite;"></div>
                        <div style="position:absolute; top:5px; left:5px; width:14px; height:14px; background:#2980b9; border:2px solid white; border-radius:50%; box-shadow:0 2px 5px rgba(0,0,0,0.5);"></div>
                       </div>`,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });

            tempMarker = L.marker(selectedCoords, { icon: targetIcon, draggable: true }).addTo(map);
            
            tempMarker.on('dragend', function(event) {
                selectedCoords = event.target.getLatLng();
            });

            const targetPoint = map.project(selectedCoords, map.getZoom());
            targetPoint.y += window.innerHeight * 0.22; 
            map.panTo(map.unproject(targetPoint, map.getZoom()), { animate: true });

            document.getElementById('infoBanner').style.display = 'none';
            document.getElementById('feedbackDrawer').classList.add('open');
        });

        // Form Gönderme
        window.submitFeedback = async function() {
            const type = document.getElementById('type').value;
            const zone = document.getElementById('zone').value;
            const comment = document.getElementById('comment').value.trim();
            if (!comment) return alert("Boş bırakmayalım, fikrini kısaca yazarsan süper olur.");

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Gönderiliyor...";

            try {
                await addDoc(collection(db, "pins"), {
                    type: type,
                    zone: zone,
                    comment: comment,
                    lat: Math.round(selectedCoords.lat),
                    lng: Math.round(selectedCoords.lng),
                    createdAt: serverTimestamp()
                });
                alert("Mesajın bize ulaştı, katkın için çok teşekkürler! 🙌");
                closeDrawer();
            } catch (err) {
                alert("Bir aksilik oldu: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Gönder";
            }
        };

        window.closeDrawer = function() {
            document.getElementById('feedbackDrawer').classList.remove('open');
            document.getElementById('comment').value = '';
            if (tempMarker) map.removeLayer(tempMarker);
            if (!auth.currentUser) document.getElementById('infoBanner').style.display = 'block';
        };

        // Admin Giriş / Çıkış
        window.openLogin = () => document.getElementById('loginModal').style.display = 'flex';
        window.closeLogin = () => document.getElementById('loginModal').style.display = 'none';

        window.adminLogin = async function() {
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPass').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                closeLogin();
            } catch (err) {
                alert("Giriş başarısız: " + err.message);
            }
        };

        window.adminLogout = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                closeDrawer();
                document.getElementById('infoBanner').style.display = 'none';
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('adminControls').style.display = 'flex';
                loadPins();
            } else {
                document.getElementById('infoBanner').style.display = 'block';
                document.getElementById('loginBtn').style.display = 'block';
                document.getElementById('adminControls').style.display = 'none';
                clearMarkers();
            }
        });

        function clearMarkers() {
            adminMarkers.forEach(m => map.removeLayer(m));
            adminMarkers = [];
        }

        function getCategoryStyle(type) {
            if (type === 'Olumlu Görüş') return { bg: '#27ae60', text: '#ffffff' };
            if (type === 'Geliştirme Talebi') return { bg: '#e67e22', text: '#ffffff' };
            if (type === 'Yatırım Talebi') return { bg: '#f1c40f', text: '#1a1a1a' };
            return { bg: '#7f8c8d', text: '#ffffff' };
        }

                const data = docSnap.data();
